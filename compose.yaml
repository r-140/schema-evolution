name: schema-evolution-lab
x-lab-env: &id001
  PG_DSN: postgresql://lab:lab@source:5432/lab
  CH_HOST: clickhouse
  CH_USER: lab
  CH_PASSWORD: lab
  KAFKA_BOOTSTRAP: kafka:9092
  CONNECT_URL: http://connect:8083
  SCHEMA_GUARD_MODE: ${SCHEMA_GUARD_MODE:-hybrid}
  ETAG_SCHEMA_POLICY: ${ETAG_SCHEMA_POLICY:-hold}
  ETAG_REQUIRE_IF_MATCH: ${ETAG_REQUIRE_IF_MATCH:-true}
services:
  source:
    image: postgres:16.8
    command:
    - postgres
    - -c
    - wal_level=logical
    - -c
    - max_replication_slots=10
    - -c
    - max_wal_senders=10
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
    - 127.0.0.1:5433:5432
    volumes:
    - pg-data:/var/lib/postgresql/data
    - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U lab -d lab
      interval: 5s
      timeout: 5s
      retries: 30
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
    - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - kafka-topics --bootstrap-server kafka:9092 --list >/dev/null
      interval: 10s
      timeout: 10s
      retries: 30
  connect:
    image: quay.io/debezium/connect:3.0.0.Final
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: evolution-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: 'true'
      VALUE_CONVERTER_SCHEMAS_ENABLE: 'true'
    ports:
    - 127.0.0.1:8083:8083
    depends_on:
      source:
        condition: service_healthy
      kafka:
        condition: service_healthy
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_USER: lab
      CLICKHOUSE_PASSWORD: lab
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports:
    - 127.0.0.1:8123:8123
    - 127.0.0.1:9000:9000
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
    - ch-data:/var/lib/clickhouse
    - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/01.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - clickhouse-client --user lab --password lab --query 'SELECT 1'
      interval: 5s
      timeout: 5s
      retries: 30
  lab:
    build: .
    environment: *id001
    ports:
    - 127.0.0.1:8090:8090
    depends_on:
      source:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
    - ./artifacts:/lab/artifacts
  airflow-db:
    image: postgres:16.8
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
    - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U airflow
      interval: 5s
      timeout: 5s
      retries: 30
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__WEBSERVER__SECRET_KEY: local-demo-only
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      LAB_URL: http://lab:8090
    command: standalone
    ports:
    - 127.0.0.1:8080:8080
    volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - airflow-home:/opt/airflow
    depends_on:
      airflow-db:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
    - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
    - 127.0.0.1:9090:9090
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
    - 127.0.0.1:3000:3000
    volumes:
    - grafana-data:/var/lib/grafana
    - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    profiles:
    - registry
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
    ports:
    - 127.0.0.1:8085:8081
    depends_on:
      kafka:
        condition: service_healthy
volumes:
  pg-data: null
  kafka-data: null
  ch-data: null
  airflow-db: null
  airflow-home: null
  grafana-data: null
